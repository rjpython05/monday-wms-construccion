services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: wms_app
      POSTGRES_PASSWORD: wms_local_dev_only
      POSTGRES_DB: wms_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_app -d wms_dev"]
      interval: 2s
      timeout: 5s
      retries: 20
